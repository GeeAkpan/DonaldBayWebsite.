<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 54" fill="none">
  <!-- Iconic Donalds Bay Lighthouse & Waves Emblem -->
  <g transform="translate(2, 3)">
    <!-- Emblem Shield / Backdrop -->
    <rect width="48" height="48" rx="10" fill="url(#db-logo-grad)" stroke="#00E599" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Light Beam Polygon -->
    <polygon points="24,14 6,8 6,24 24,18" fill="#00E599" opacity="0.35"/>
    
    <!-- Lighthouse Tower -->
    <!-- Dome / Lantern Room -->
    <path d="M22 10C22 8.89543 22.8954 8 24 8C25.1046 8 26 8.89543 26 10V13H22V10Z" fill="#00E599"/>
    <rect x="20" y="13" width="8" height="2" fill="#FFFFFF" rx="0.5"/>
    <rect x="21" y="15" width="6" height="4" fill="#00E599" rx="0.5"/>
    <rect x="23" y="16" width="2" height="2" fill="#FFFFFF"/>
    <rect x="19" y="19" width="10" height="2" fill="#FFFFFF" rx="0.5"/>
    
    <!-- Lighthouse Tapered Body -->
    <path d="M20 21L17.5 35H30.5L28 21H20Z" fill="#FFFFFF"/>
    <!-- Stripes on tower -->
    <polygon points="19.2 25 28.8 25 28.3 28 18.7 28" fill="#00E599"/>
    <!-- Base -->
    <rect x="16" y="35" width="16" height="3" fill="#00E599" rx="1"/>
    
    <!-- Ocean / Bay Wave Curves -->
    <path d="M6 39C10 37 14 41 18 39C22 37 26 41 30 39C34 37 38 41 42 39" stroke="#00E599" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M6 43C10 41 14 45 18 43C22 41 26 45 30 43C34 41 38 45 42 43" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- Gradients Definition -->
  <defs>
    <linearGradient id="db-logo-grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#052F33"/>
      <stop offset="1" stop-color="#021214"/>
    </linearGradient>
  </defs>

  <!-- Embedded Typography Styles for 100% Crisp Browser Rendering -->
  <style>
    .db-brand-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 21px;
      letter-spacing: 0.05em;
      fill: #FFFFFF;
    }
    .db-brand-tagline {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      font-weight: 700;
      font-size: 9.5px;
      letter-spacing: 0.22em;
      fill: #00E599;
    }
  </style>

  <!-- Corporate Typography -->
  <text x="62" y="27" class="db-brand-text">DONALDS BAY</text>
  <text x="63" y="42" class="db-brand-tagline">LIMITED · CIVIL ENGINEERING</text>
</svg>
