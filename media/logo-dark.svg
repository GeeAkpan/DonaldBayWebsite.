    <!-- Light Beam -->
    <polygon points="24,14 6,8 6,24 24,18" fill="#00E599" opacity="0.3"/>
    <!-- Lighthouse Dome -->
    <path d="M22 10C22 8.89543 22.8954 8 24 8C25.1046 8 26 8.89543 26 10V13H22V10Z" fill="#00E599"/>
    <rect x="20" y="13" width="8" height="2" fill="#FFFFFF" rx="0.5"/>
    <rect x="21" y="15" width="6" height="4" fill="#00E599" rx="0.5"/>
    <rect x="23" y="16" width="2" height="2" fill="#FFFFFF"/>
    <rect x="19" y="19" width="10" height="2" fill="#FFFFFF" rx="0.5"/>
